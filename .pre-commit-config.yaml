# Runs the fast gates on every commit. Two heavier tools stay out: pylint and
# refurb. They overlap with the ruff PL and RUF rule sets. They also slow the
# commit loop for little added signal. Run them by hand or in CI instead.
#
# Install with: uv run pre-commit install

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false

      - id: vulture
        name: vulture dead code
        entry: uv run vulture
        language: system
        types: [python]
        pass_filenames: false

      - id: xenon
        name: xenon complexity
        entry: uv run xenon --max-absolute C --max-modules C --max-average A src
        language: system
        types: [python]
        pass_filenames: false
